<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKW Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8f8;--sc:#f8eaee;--sch:#f1e2e7;--tx:#22191c;--txv:#524349;--pri:#9c3a64;--onpri:#fff;--pc:#ffd9e5;--onpc:#3e0021;--sec:#fcdbe7;--onsec:#2b151d;--tc:#ffdbcb;--ontc:#341100;--er:#ba1a1a;--erc:#ffdad6;--oner:#410002;--ol:#85737a;
--spring:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#191113;--sc:#261a1d;--sch:#312428;--tx:#efdfe2;--txv:#d6c2c8;--pri:#ffb0cd;--onpri:#5e1137;--pc:#7c2a4e;--onpc:#ffd9e5;--sec:#5a3f4a;--onsec:#fad8e4;--tc:#5b3a2a;--ontc:#ffdbcb;--er:#ffb4ab;--erc:#93000a;--oner:#ffdad6;--ol:#9e8c93}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#191113;--sc:#261a1d;--sch:#312428;--tx:#efdfe2;--txv:#d6c2c8;--pri:#ffb0cd;--onpri:#5e1137;--pc:#7c2a4e;--onpc:#ffd9e5;--sec:#5a3f4a;--onsec:#fad8e4;--tc:#5b3a2a;--ontc:#ffdbcb;--er:#ffb4ab;--erc:#93000a;--oner:#ffdad6;--ol:#9e8c93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Roboto Flex',system-ui,-apple-system,Roboto,sans-serif;font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 96px}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.hero{position:relative;padding:12px 4px 20px;display:flex;align-items:center;gap:16px}
.blob{width:72px;height:72px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;animation:morph 6s ease-in-out infinite;flex:none}
.blob svg{width:34px;height:34px}
@keyframes morph{0%,100%{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:rotate(0)}33%{border-radius:40% 60% 45% 55%/60% 40% 60% 40%;transform:rotate(8deg)}66%{border-radius:50% 50% 35% 65%/40% 55% 45% 60%;transform:rotate(-6deg)}}
h1{font-size:40px;line-height:1;margin:0;font-weight:900;letter-spacing:-1px;font-stretch:110%}
.sub{margin:6px 0 0;color:var(--txv);font-size:14px}
.card{background:var(--sc);border-radius:32px;padding:16px;margin-bottom:12px}
.card.hi{background:var(--sch)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--txv);margin:0 0 8px 8px}
textarea{width:100%;height:150px;resize:vertical;background:var(--bg);color:var(--tx);border:2px solid transparent;border-radius:24px;padding:14px 16px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;outline:0;transition:border-color .2s,border-radius .35s var(--spring)}
textarea:focus{border-color:var(--pri);border-radius:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--sec);color:var(--onsec);font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:border-radius .35s var(--spring),transform .25s var(--spring),background .2s}
.btn:active{border-radius:14px;transform:scale(.96)}
.btn.p{background:var(--pri);color:var(--onpri)}
.btn.er{background:var(--erc);color:var(--oner)}
.btn:disabled{opacity:.45;pointer-events:none}
.grp{display:flex;gap:2px}
.grp button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;border:0;font:inherit;background:var(--bg);color:var(--txv);cursor:pointer;border-radius:8px;transition:border-radius .4s var(--spring),background .2s,color .2s,flex .4s var(--spring)}
.grp button:first-child{border-radius:30px 8px 8px 30px}.grp button:last-child{border-radius:8px 30px 30px 8px}
.grp button b{font-weight:800;font-size:17px}.grp button small{font-size:11px;opacity:.8}
.grp button.on{background:var(--pri);color:var(--onpri);border-radius:30px;flex:1.35}
#stage{display:flex;justify-content:center;margin-bottom:12px}
#holder{position:relative;overflow:hidden;border-radius:28px;background:#000}
#frame{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.opt{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:24px;padding:12px 16px;margin-top:12px}
.opt span{flex:1;font-size:14px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:2;cursor:pointer}
.trk{position:absolute;inset:0;border-radius:16px;border:2px solid var(--ol);background:var(--sch);transition:background .25s,border-color .25s}
.th{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:all .35s var(--spring);display:grid;place-items:center}
.sw input:checked+.trk{background:var(--pri);border-color:var(--pri)}
.sw input:checked+.trk .th{left:24px;top:2px;width:24px;height:24px;background:var(--onpri);margin:0}
.sw input:checked+.trk .th:after{content:"";width:10px;height:5px;border-left:2.5px solid var(--pri);border-bottom:2.5px solid var(--pri);transform:rotate(-45deg) translate(1px,-1px)}
.recbtn{width:100%;min-height:76px;border:0;border-radius:38px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;margin-top:12px;transition:border-radius .5s var(--spring),background .25s,color .25s,transform .25s var(--spring)}
.recbtn svg{width:30px;height:30px}
.recbtn:active{transform:scale(.97)}
.recbtn.live{background:var(--erc);color:var(--oner);border-radius:24px}
.wave{display:none;height:20px;overflow:hidden;margin-top:14px;color:var(--pri)}
.wave.on{display:block}
.wave svg{width:calc(100% + 24px);height:20px;animation:slide .8s linear infinite}
@keyframes slide{to{transform:translateX(-24px)}}
.time{display:none;text-align:center;font-weight:800;font-size:28px;margin-top:6px;font-variant-numeric:tabular-nums}
.time.on{display:block}
#res{display:none}
video{width:100%;max-height:60vh;border-radius:24px;background:#000;display:block}
.dl{width:100%;min-height:68px;border:0;border-radius:34px;background:var(--tc);color:var(--ontc);font:inherit;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;cursor:pointer;transition:border-radius .4s var(--spring),transform .25s var(--spring)}
.dl:active{border-radius:18px;transform:scale(.97)}
.dl svg{width:28px;height:28px}
#info{text-align:center;color:var(--txv);font-size:13px;margin-top:8px}
#snack{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:16px;padding:14px 18px;font-size:14px;transform:translateY(160%);transition:transform .45s var(--spring);z-index:9}
#snack.on{transform:none}
.note{color:var(--txv);font-size:12px;text-align:center;margin:16px 8px 0}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<div class="blob"><svg class="i" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4h-4z"/></svg></div>
<div><h1>MKW<br>Recorder</h1><p class="sub">HTML-анимация → видео на телефон</p></div>
</div>

<div class="card">
<p class="lbl">HTML-код</p>
<textarea id="code" placeholder="Вставь сюда полный код анимации…" spellcheck="false"></textarea>
<div class="row">
<button class="btn" id="paste"><svg class="i" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 18H5V4h2v3h10V4h2v16z"/></svg>Вставить</button>
<button class="btn er" id="clear"><svg class="i" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Очистить</button>
<button class="btn" id="demo"><svg class="i" viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>Пример</button>
<button class="btn p" id="run" style="flex-basis:100%"><svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Запустить</button>
</div>
</div>

<div class="card hi">
<div id="stage"><div id="holder"><iframe id="frame" sandbox="allow-scripts allow-same-origin"></iframe></div></div>
<p class="lbl">Формат</p>
<div class="grp" id="fmt">
<button data-v="1080x1920" class="on"><b>9:16</b><small>1080×1920</small></button>
<button data-v="1920x1080"><b>16:9</b><small>1920×1080</small></button>
<button data-v="1080x1080"><b>1:1</b><small>1080×1080</small></button>
</div>
<label class="opt"><span>Остановить, когда анимация зациклится</span><span class="sw"><input type="checkbox" id="auto" checked><span class="trk"><span class="th"></span></span></span></label>
<div class="wave" id="wave"><svg viewBox="0 0 24 20" preserveAspectRatio="none"><path id="wp" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d=""/></svg></div>
<div class="time" id="time">0:00</div>
<button class="recbtn" id="rec"><svg class="i" id="ri" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span id="rt">Записать</span></button>
</div>

<div class="card" id="res">
<video id="vid" controls playsinline loop></video>
<button class="dl" id="save"><svg class="i" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>Скачать видео</button>
<div id="info"></div>
</div>
<p class="note">Записывается canvas: игры, частицы, WebGL, three.js. Качество всегда максимальное: 60 кадров/сек и 40 Мбит/с. Библиотеки подключай с cdnjs или jsDelivr.</p>
</div>
<div id="snack"></div>

<script>
var $=function(id){return document.getElementById(id)};
var frame=$('frame'),rec=null,chunks=[],tick=null,blob=null,ext='webm',dl=null,stream=null,stopping=false,FMT='1080x1920',snT=null,t0=0;

var DEMO='<!doctype html><html><body style="margin:0;background:#0d0709"><canvas id="c"></canvas><script>'+
'var c=document.getElementById("c"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;'+
'function f(t){var s=t/1000*Math.PI*2/4;x.fillStyle="#0d0709";x.fillRect(0,0,c.width,c.height);'+
'for(var i=0;i<40;i++){var a=i/40*6.2832+s,r=Math.min(c.width,c.height)*(.15+.3*Math.abs(Math.sin(s+i*.3)));x.fillStyle="hsl("+(320+i*2)+",90%,65%)";x.beginPath();x.arc(c.width/2+Math.cos(a)*r,c.height/2+Math.sin(a)*r,10+8*Math.sin(s*2+i),0,6.2832);x.fill()}requestAnimationFrame(f)}f(0)'+
'<\/script></body></html>';

(function(){var d='M0 10',i;for(i=0;i<40;i++)d+=(i?'t12 0':'q6 -9 12 0');$('wp').setAttribute('d',d)})();

function toast(t){var s=$('snack');s.textContent=t;s.classList.add('on');clearTimeout(snT);snT=setTimeout(function(){s.classList.remove('on')},2800)}
function dim(){var a=FMT.split('x');return{w:+a[0],h:+a[1]}}
function layout(){var d=dim(),w=Math.min($('stage').clientWidth,520),s=Math.min(w/d.w,(innerHeight*0.5)/d.h);
frame.style.width=d.w+'px';frame.style.height=d.h+'px';frame.style.transform='scale('+s+')';
$('holder').style.width=d.w*s+'px';$('holder').style.height=d.h*s+'px'}

function run(){
if(rec)return;
var src=$('code').value.trim();if(!src){toast('Сначала вставь код');return}
var inj='<script>try{Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})}catch(e){}<\/script>';
var m=src.match(/<!doctype[^>]*>/i);
src=m?src.slice(0,m.index+m[0].length)+inj+src.slice(m.index+m[0].length):inj+src;
layout();frame.srcdoc=src}

function findCanvas(){var d;try{d=frame.contentDocument}catch(e){return null}
if(!d)return null;var best=null,ba=0;
d.querySelectorAll('canvas').forEach(function(c){var a=c.width*c.height;if(a>ba){ba=a;best=c}});return best}

function pickMime(){
var l=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
for(var i=0;i<l.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(l[i]))return l[i]}return ''}

var fp=document.createElement('canvas');fp.width=fp.height=16;var fx=fp.getContext('2d',{willReadFrequently:true});
function sig(c){try{fx.drawImage(c,0,0,16,16);var d=fx.getImageData(0,0,16,16).data,a=[],i;for(i=0;i<d.length;i+=4)a.push(d[i]+d[i+1]+d[i+2]);return a}catch(e){return null}}
function diff(a,b){var s=0,i;for(i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length/765}

function ui(on){
$('rec').classList.toggle('live',on);$('rt').textContent=on?'Стоп':'Записать';
$('ri').innerHTML=on?'<rect x="6" y="6" width="12" height="12" rx="2"/>':'<circle cx="12" cy="12" r="8"/>';
$('wave').classList.toggle('on',on);$('time').classList.toggle('on',on);
$('run').disabled=on;$('clear').disabled=on;$('paste').disabled=on;$('demo').disabled=on}

async function start(){
if(rec){stop();return}
if(!window.MediaRecorder){toast('Этот браузер не умеет записывать видео');return}
var c=findCanvas();
try{
if(c){stream=c.captureStream(60)}
else if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia){
toast('Canvas не найден. Выбери вкладку для записи экрана');
stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:60},audio:false})}
else{toast('Canvas не найден. На телефоне пишется только canvas');return}
}catch(e){toast('Не удалось начать запись');return}
var mt=pickMime(),o={videoBitsPerSecond:40000000};if(mt)o.mimeType=mt;
chunks=[];stopping=false;
try{rec=new MediaRecorder(stream,o)}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){toast('Запись не поддерживается');return}}
rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
rec.onstop=finish;
$('res').style.display='none';
var s0=c?sig(c):null,maxd=0;
rec.start(500);t0=Date.now();ui(true);
tick=setInterval(function(){
var el=Date.now()-t0,sec=Math.floor(el/1000);
$('time').textContent=Math.floor(sec/60)+':'+('0'+sec%60).slice(-2);
if(c&&s0&&$('auto').checked){var s=sig(c);if(s){var d=diff(s0,s);if(d>maxd)maxd=d;if(el>1500&&maxd>0.04&&d<0.004){stop();return}}}
if(el>300000)stop()},100)}

function stop(){if(!rec||stopping)return;stopping=true;clearInterval(tick);try{rec.stop()}catch(e){}}

function finish(){
var type=(rec&&rec.mimeType)||'video/webm';
ext=type.indexOf('mp4')>-1?'mp4':'webm';
blob=new Blob(chunks,{type:type});
if(stream)stream.getTracks().forEach(function(t){t.stop()});
var sec=Math.round((Date.now()-t0)/1000);
rec=null;stream=null;stopping=false;ui(false);
if(!blob.size){toast('Видео пустое. Проверь, что анимация идёт');return}
var old=$('vid').src;$('vid').src=URL.createObjectURL(blob);if(old&&old.indexOf('blob:')===0)URL.revokeObjectURL(old);
$('res').style.display='block';
$('info').textContent=ext.toUpperCase()+' · '+sec+' сек · '+(blob.size/1048576).toFixed(1)+' МБ';
$('vid').play().catch(function(){});
$('res').scrollIntoView({behavior:'smooth'})}

async function save(){
if(!blob)return;
if(!dl){toast('Скачивание тут недоступно. Зажми видео и выбери «Сохранить»');return}
try{await dl.save({filename:'mkw-video-'+Date.now()+'.'+ext,data:blob});toast('Сохранено')}
catch(e){var c=e&&e.code;toast(c==='declined'?'Скачивание отменено':c==='rate_limited'?'Подожди пару секунд и повтори':'Не удалось сохранить')}}

$('run').onclick=run;
$('rec').onclick=start;
$('save').onclick=save;
$('demo').onclick=function(){$('code').value=DEMO;run()};
$('clear').onclick=function(){$('code').value='';frame.removeAttribute('srcdoc');frame.src='about:blank';$('res').style.display='none';toast('Текст удалён')};
$('paste').onclick=async function(){try{$('code').value=await navigator.clipboard.readText();toast('Вставлено')}catch(e){toast('Нет доступа к буферу. Вставь вручную в поле')}};
$('fmt').onclick=function(e){var b=e.target.closest('button');if(!b||rec)return;
[].forEach.call($('fmt').children,function(x){x.classList.remove('on')});b.classList.add('on');FMT=b.dataset.v;layout();
if($('code').value.trim())run()};
addEventListener('resize',layout);layout();
(async function(){try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){dl=null}})();
</script>
</body>
</html>
