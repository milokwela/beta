  if(d.k=='hi'){if(!part){part=d.id;pairH(d)}else pub('fb1/g/'+hostLow+'/s',d.id==part?{k:'hi',n:myName,to:d.id}:{k:'busy',to:d.id});return}
  if(d.id!==part||role!='host'||d.q<=lastQ)return;lastQ=d.q;lastMsg=Date.now();const a=inp[1];a.m=d.m;a.f=d.f;a.n=d.n;a.t=d.t;a.b=d.b;a.z=d.z;a.k=d.k;a.o=d.o;return}
 if(p[3]=='s'){if(!gH||p[2]!=gH||d.to!=gid)return;
  if(d.k=='hi'){if(role!='guest')pairG(d)}else if(d.k=='busy'){gH='';clearInterval(tJ);err('Команда уже занята')}
  else if(d.k=='s'&&role=='guest'){if(d.q<=lastQ)return;lastQ=d.q;lastMsg=Date.now();NET=d;NET.at=performance.now()}}}
function watch(){clearInterval(tW);lastMsg=Date.now();tW=setInterval(()=>{if(Date.now()-lastMsg>7000)menu(role=='guest'?'Связь потеряна':'Соперник вышел')},1000)}
function pairH(d){names[0]=myName;names[1]=nm(d.n);setRole('host',0);lastQ=0;hq=0;clearInterval(tR);
 conn={open:true,send:o=>{o.q=++hq;o.to=part;pub('fb1/g/'+hostLow+'/s',o)}};pub('fb1/g/'+hostLow+'/s',{k:'hi',n:myName,to:part});pubRoom();watch();reset();play(true);err('')}
function pairG(d){names[0]=nm(d.n);names[1]=myName;setRole('guest',1);lastQ=0;gq=0;NET=null;clearInterval(tJ);clearInterval(tR);
 conn={open:true,send:o=>{o.q=++gq;o.id=gid;pub('fb1/g/'+gH+'/i',o)}};watch();play(true);err('');sendIn()}
function pubRoom(){if(hostLow)pub('fb1/room/'+hostLow,{n:myName,b:part?1:0,h:++hb},true)}
function leave(){clearInterval(tH);clearInterval(tW);clearInterval(tJ);clearInterval(tR);if(hostLow){pub('fb1/room/'+hostLow,null,true);unsub('fb1/g/'+hostLow+'/i')}if(gH)unsub('fb1/g/'+gH+'/s');unsub('fb1/room/+');unsub('fb1/u/+');hostLow=gH='';part=null;conn=null;NET=null;RM={}}
addEventListener('pagehide',()=>{if(hostLow)pub('fb1/room/'+hostLow,null,true)});
function menu(t){mm++;leave();role=null;S.ph=0;S.g=[-1,1];play(false);pane('mm');err(t)}
function wait(t){$('wtt').textContent=t;err('');pane('wt')}
async function mk(){const tok=++mm;leave();err('Подключаемся…');if(!await waitOn(7000))return err('Нет связи с сервером. Выключи VPN или смени сеть и попробуй снова.');if(tok!=mm)return;
 hostLow=low(myName);part=null;wait('Команда «'+myName+'» создана.\nЖдём друга…\nОн увидит её в списке: Присоединиться.');sub('fb1/g/'+hostLow+'/i');pubRoom();tH=setInterval(pubRoom,3000)}
async function lobby(){const tok=++mm;leave();err('Подключаемся…');if(!await waitOn(7000))return err('Нет связи с сервером. Выключи VPN или смени сеть и попробуй снова.');if(tok!=mm)return;
 err('');pane('lb');sub('fb1/room/+');sub('fb1/u/+');rooms();tR=setInterval(rooms,1000)}
function rooms(){const el=$('rooms'),now=Date.now(),ks=Object.keys(RM).filter(k=>{const r=RM[k];return r.live&&!r.b&&now-r.at<9000&&k!=low(myName)});el.textContent='';
 $('lbt').textContent='Команды друзей (зарегистрировано: '+Object.values(regRes).filter(Boolean).length+')';
 if(!ks.length){const d=document.createElement('div');d.className='no';d.textContent='Пока нет команд. Попроси друга создать команду — она появится здесь.';el.appendChild(d)}
 ks.forEach(k=>{const d=document.createElement('div'),sp=document.createElement('span'),b=document.createElement('button');d.className='rm';sp.textContent='🦛 '+RM[k].n+'  👥 друг';b.textContent='Присоединиться';b.onclick=()=>joinR(k);d.append(sp,b);el.appendChild(d)})}
function joinR(k){if(gH)return;err('Подключаемся…');gH=k;gid=Math.random().toString(36).slice(2,10);sub('fb1/g/'+k+'/s');let n=0;const send=()=>pub('fb1/g/'+k+'/i',{k:'hi',n:myName,id:gid});send();clearInterval(tJ);
 tJ=setInterval(()=>{if(role=='guest'){clearInterval(tJ);return}if(++n>8){clearInterval(tJ);unsub('fb1/g/'+k+'/s');gH='';err('Не удалось соединиться. Попробуй ещё раз.');return}send()},1000)}
function sendIn(){if(role=='guest'&&conn&&conn.open)conn.send({k:'i',m:inp[1].m,f:inp[1].f,n:inp[1].n,t:inp[1].t,b:inp[1].b,z:inp[1].z,k:inp[1].k,o:inp[1].o})}
function enter(){$('me').textContent='👤 '+myName+(isAdmin()?' ⭐':'');pane('mm');err('')}
function init(){busStart();let ok=0;try{myName=localStorage.fbn||'';ok=localStorage.fbr=='1'&&myName}catch(e){}if(ok)enter();else pane('rg')}
async function register(){if(regBusy)return;const raw=$('rnick').value.trim();if(!/^[A-Za-zА-Яа-яЁё0-9_\-]{3,12}$/.test(raw))return err('Ник: 3–12 символов — буквы, цифры, _ или -');regBusy=1;err('Проверяем ник…');
 try{busStart();if(!await waitOn(9000))return err('Нет связи с сервером. Выключи VPN или смени сеть и попробуй снова.');
  const t='fb1/u/'+low(raw);let key=localStorage.fbk;if(!key){key=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.fbk=key}
  const hh=await sha(key);regRes[t]=undefined;sub(t);await sleep(2500);const ex=regRes[t];
  if(ex&&ex.h!=hh){unsub(t);return err('Ник «'+raw+'» уже занят. Выбери другой.')}
  pub(t,{n:raw,h:hh,t:Date.now()},true);await sleep(700);unsub(t);localStorage.fbn=raw;localStorage.fbr='1';myName=raw;enter()}
 catch(e){err('Ошибка: '+(e.message||e))}finally{regBusy=0}}
$('rgb').onclick=()=>{audio();register()};$('mk').onclick=()=>{audio();mk()};$('jn').onclick=()=>{audio();lobby()};
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>menu(''));

$('kb').onclick=()=>{const t=inp[me].k?0:1;inp[me].k=t;sendIn();$('kb').textContent=t?'🤖 БЕРСЕРК: ВКЛ':'🤖 БЕРСЕРК: ВЫКЛ';$('kb').classList.toggle('on',!!t);tone(120,500,.6,'sawtooth')};
$('ob').onclick=()=>{const t=inp[me].o?0:1;inp[me].o=t;sendIn();$('ob').textContent=t?'🛸 ЗА КАРТУ: ВКЛ':'🛸 ЗА КАРТУ: ВЫКЛ';$('ob').classList.toggle('on',!!t);tone(300,900,.4,'triangle')};
$('pb').onclick=()=>{inp[me].z=1;sendIn()};$('pc').onclick=()=>{inp[me].z=0;sendIn()};$('px').onclick=()=>menu('');
$('tb').onclick=()=>{const t=inp[me].t?0:1;inp[me].t=t;sendIn();$('tb').textContent=t?'🚀 ТУРБО: ВКЛ':'🚀 ТУРБО: ВЫКЛ';$('tb').classList.toggle('on',!!t);tone(200,700,.4,'sawtooth')};
$('gear').onclick=()=>{mute=!mute;const a=$('bgm');if(mute)a.pause();else a.play().catch(()=>{});$('gear').textContent=mute?'🔇':'🔊'};
/* ---------- управление ---------- */
let mL=0,mR=0;const setM=()=>{inp[me].m=mR-mL;sendIn()};
[['bl',0],['br',1]].forEach(([id,r])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');if(r)mR=1;else mL=1;setM();audio()});['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>{b.classList.remove('on');if(r)mR=0;else mL=0;setM()}))});

['pointerup','pointercancel'].forEach(t=>fb.addEventListener(t,()=>{inp[me].f=0;sendIn()}));

 if(role=='guest')guestSync(dt);else if(role=='solo'||(role=='host'&&conn&&conn.open))step(dt);else S.T+=dt;
 st+=dt;if(st>.05){st=0;if(role=='host'&&conn&&conn.open)conn.send({k:'s',ph:S.ph,T:S.T,cnt:S.cnt,rt:S.rt,b:[S.x,S.z,S.a,S.vx,S.vz,S.w],g:S.g,bu:S.bu,cd:S.cd,hp:S.hp,dd:S.dead,cp:S.cp,cn:S.coins,co:S.cl,iv:S.inv,tb:S.tb,bl:S.bl,al:S.alt,pz:S.pz,bk:S.bk,bt:S.bt,bx:S.bx,sp:S.sp,of:S.of,pj:S.pj||[],dl:OB.flatMap((o,i)=>o.dead&&Math.abs(o.s+S.z)<90?[i]:[])});else sendIn()}
 view(dt);ren.render(sc,cam)}
