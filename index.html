const isBot=i=>mode=='solo'?i!=0:mode=='host'?i==2:false,cl=(v,a)=>Math.max(-a,Math.min(a,v));
function fxStep(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.h+=q.vh*dt;q.vh*=q.ty==0?1:.96;const k=Math.exp(-2.2*dt);q.vx*=k;q.vy*=k;q.l-=dt*(q.ty==1?1.1:1.8);q.r+=dt*(q.ty==1?10:5);
  if(q.l<=0){q.s.visible=false;pool.push(q.s);parts.splice(i,1);continue}q.s.position.set(q.x,q.h,q.y);q.s.scale.setScalar(q.r*2.4);q.s.material.opacity=Math.min(1,q.l*1.2)*(q.ty==1?.85:.7)}
 if(Math.hypot(b.vx,b.vy)>80&&Math.random()<.6)pp(b.x+(Math.random()-.5)*50,b.y+(Math.random()-.5)*50,2,0,0,4,4,2,.6);
 shake=Math.max(0,shake-dt);if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}}
function step(dt){t+=dt;if(state=='play')tm+=dt;
 for(const p of ps){if(isBot(p.i)){const tx=cx(b.y-220)-b.x,want=Math.atan2(tx,220)-b.a+Math.sin(t*1.3+p.i*2)*.5;p.aimT=cl(want,1.2);p.F=Math.random()<dt*.7?1:0}
  p.aim+=cl(p.aimT-p.aim,4*dt);p.cd-=dt;p.gas=Math.min(100,p.gas+15*dt);
  if(state=='play'&&p.F&&p.cd<=0&&p.gas>=20){fire(p);p.cd=.3;p.gas-=20}}
 const d=Math.exp(-dt);b.vx*=d;b.vy*=d;b.w*=Math.exp(-2.2*dt);const sp=Math.hypot(b.vx,b.vy);if(sp>MAXV){b.vx*=MAXV/sp;b.vy*=MAXV/sp}
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
 const c=cx(b.y),lim=hw(b.y)-8-R,dx=b.x-c;if(Math.abs(dx)>lim){const sg=Math.sign(dx);b.x=c+sg*lim;if(b.vx*sg>0)b.vx=-b.vx*.5;b.vy*=.92}
 if(state=='play')for(const o of obs){if(Math.abs(o.y-b.y)>260)continue;
  for(const[ox,oy,r,dead]of circs(o,t)){const ex=b.x-ox,ey=b.y-oy,dd=Math.hypot(ex,ey);if(dd<R+r){if(dead){die();fxStep(dt);return}
   const nx=ex/(dd||1),ny=ey/(dd||1),m=R+r;b.x=ox+nx*m;b.y=oy+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.7*vn*nx;b.vy-=1.7*vn*ny;b.w+=(Math.random()-.5)*3}}}}
 const ci=Math.floor((S-b.y)/CP);if(ci>cpi){cpi=ci;toast('Чекпоинт ✓');if(mode=='host')send({e:'cp'})}
 if(state=='play'&&b.y<110){state='win';showWin()}
 fxStep(dt)}
function gstep(dt){t+=dt;
 if(sn){const age=Math.min(.15,(performance.now()-sr)/1000),px=sn.x+sn.vx*age,py=sn.y+sn.vy*age;
  if(Math.hypot(px-b.x,py-b.y)>150){b.x=px;b.y=py;snap=true}else{const k=Math.min(1,dt*12);b.x+=(px-b.x)*k;b.y+=(py-b.y)*k}
  b.a+=(sn.a+sn.w*age-b.a)*Math.min(1,dt*12);b.vx=sn.vx;b.vy=sn.vy;b.w=sn.w;t+=(sn.t+age-t)*.2;tm=sn.tm;deaths=sn.d;cpi=sn.cp;
  ps.forEach((p,i)=>{p.aim+=(sn.aim[i]-p.aim)*.5;p.gas=sn.gas[i]});
  if(state=='wait'&&sn.st=='play'){state='play';hide()}
  if(sn.st=='win'&&state!='win'){state='win';showWin()}}
 fxStep(dt)}
const fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');
const hide=()=>$('ov').style.display='none',show=h=>{$('ov').style.display='flex';$('cd').innerHTML=h};
function setMe(m,i){mode=m;me=i;document.documentElement.style.setProperty('--pc','#'+PC[i].toString(16));
 const nm=['🟠','⚪','🟢'].map((e,k)=>e+(k==i?' ты':m=='solo'||k==2?' бот':' друг'));$('who').innerHTML=nm.map(s=>'<span class="chip" style="margin-right:4px">'+s+'</span>').join('')}
function showWin(){show('<h1>🏁 Финиш!</h1><p>Время: <b>'+fmt(tm)+'</b></p><p>Падений на шипы: <b>'+deaths+'</b></p>'+(mode=='guest'?'<p>Ждём хоста…</p>':'<button class="mb" onclick="again()">Ещё раз</button>'))}
function again(){reset();state='play';hide();if(mode=='host')send({e:'restart'})}
function menu(){state='menu';mode='menu';me=-1;$('who').innerHTML='';show('<h1>🦛 Пыкающие бегемоты 3D</h1><p>Три бегемота — одна лодка. Слева — ползунок: куда пукать. Справа — <b>ПЫК!</b>, держи для повтора. Газ кончается — жди, пока заполнится кольцо.</p><button class="mb" id="bs">🎮 Одному (два бота рядом)</button><button class="mb" id="bh">🌐 Онлайн: создать комнату</button><div class="row"><input id="code" placeholder="код" inputmode="numeric" maxlength="4"><button class="mb" id="bj">Войти</button></div><p><small>Онлайн вас двое на разных телефонах, третий бегемот — бот.</small></p>');
 $('bs').onclick=()=>{aud();setMe('solo',0);reset();state='play';hide()};$('bh').onclick=hostRoom;$('bj').onclick=joinRoom}
function msg(s){show('<h1>'+s+'</h1><button class="mb" onclick="location.reload()">В меню</button>')}
function lost(){state='lost';msg('Связь потеряна 😢')}
const ICE={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
function hostRoom(){aud();if(typeof Peer=='undefined')return msg('Онлайн недоступен (нет интернета?)');
 const code=String(1000+Math.floor(Math.random()*9000));peer=new Peer('hpfart'+code,ICE);
 peer.on('open',()=>show('<h1>Код комнаты</h1><h1 style="font-size:52px;letter-spacing:6px">'+code+'</h1><p>Пусть друг откроет эту же страницу на своём телефоне и нажмёт «Войти» с этим кодом.</p><p>Ждём…</p><button class="mb" onclick="location.reload()">Отмена</button>'));
 peer.on('error',e=>{if(e.type=='unavailable-id')hostRoom();else msg('Ошибка: '+e.type)});
 peer.on('connection',c=>{if(conn)return;conn=c;
  c.on('open',()=>{setMe('host',0);reset();state='play';hide();setInterval(()=>send({s:{x:b.x,y:b.y,vx:b.vx,vy:b.vy,a:b.a,w:b.w,t,tm,d:deaths,cp:cpi,st:state,aim:ps.map(p=>p.aim),gas:ps.map(p=>p.gas)}}),50)});
  c.on('data',m=>{if(m.i){ps[1].aimT=m.i[0];ps[1].F=m.i[1]}});c.on('close',lost)})}
function joinRoom(){aud();const code=$('code').value.trim();if(code.length<4)return toast('Введи 4 цифры');if(typeof Peer=='undefined')return msg('Онлайн недоступен (нет интернета?)');
 show('<h1>Подключаемся…</h1>');peer=new Peer(undefined,ICE);
 peer.on('error',e=>msg(e.type=='peer-unavailable'?'Комната не найдена':'Ошибка: '+e.type));
 peer.on('open',()=>{conn=peer.connect('hpfart'+code,{reliable:true,serialization:'json'});
  conn.on('open',()=>{setMe('guest',1);reset();state='wait';show('<h1>Подключено ✓</h1><p>Ждём хоста…</p>');setInterval(sendIn,100)});
  conn.on('close',lost);
  conn.on('data',m=>{if(m.s){sn=m.s;sr=performance.now()}else if(m.e=='f')fx(ps[m.p]);else if(m.e=='die'){shake=.45;boom()}
   else if(m.e=='cp')toast('Чекпоинт ✓');else if(m.e=='restart'){reset();sn=null;state='play';hide()}})})}
const sendIn=()=>{if(mode=='guest')send({i:[ps[1].aimT,ps[1].F]})};
/* ---------- controls ---------- */
const pad=$('pad'),knob=$('knob'),fb=$('fb');
function knobSync(){const p=ps[Math.max(me,0)],m=pad.clientWidth/2-38;knob.style.transform='translateX('+(p.aimT/1.2*m)+'px)'}
function padSet(e){if(me<0)return;const r=pad.getBoundingClientRect(),m=r.width/2-38;ps[me].aimT=cl((e.clientX-r.left-r.width/2)/m,1)*1.2;knobSync();sendIn()}
let padOn=false;pad.addEventListener('pointerdown',e=>{padOn=true;try{pad.setPointerCapture(e.pointerId)}catch(_){}padSet(e)});
pad.addEventListener('pointermove',e=>{if(padOn)padSet(e)});['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,()=>padOn=false));
const fset=v=>{if(me<0)return;ps[me].F=v;fb.classList.toggle('on',!!v);sendIn()};
fb.addEventListener('pointerdown',e=>{e.preventDefault();try{fb.setPointerCapture(e.pointerId)}catch(_){}aud();fset(1)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>fb.addEventListener(n,()=>fset(0)));
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(me<0)return;const p=ps[me];if(e.code=='KeyA'||e.code=='ArrowLeft'){p.aimT=Math.max(-1.2,p.aimT-.15);knobSync();sendIn()}
 else if(e.code=='KeyD'||e.code=='ArrowRight'){p.aimT=Math.min(1.2,p.aimT+.15);knobSync();sendIn()}else if(e.code=='Space'||e.code=='KeyW'||e.code=='ArrowUp'){e.preventDefault();fset(1)}});
addEventListener('keyup',e=>{if(e.code=='Space'||e.code=='KeyW'||e.code=='ArrowUp')fset(0)});
/* ---------- render ---------- */
let W,H;function rs(){W=innerWidth;H=innerHeight;R3.setSize(W,H,false);cam3.aspect=W/H;cam3.fov=W/H<1?74:62;cam3.updateProjectionMatrix();knobSync()}
addEventListener('resize',rs);rs();
function upd(dt){
 boat.position.set(b.x,1+Math.sin(t*3)*1.2,b.y);boat.rotation.set(Math.sin(t*1.7)*.03,-b.a,-b.w*.08+Math.sin(t*2.2)*.03);
 ps.forEach((p,i)=>{const h=hips[i];h.rotation.y=-p.aim;p.sq=Math.max(0,p.sq-dt*5);h.scale.set(1+.15*p.sq,1-.25*p.sq,1+.15*p.sq)});
 foam.position.set(b.x,.5,b.y);foam.scale.setScalar(1+.06*Math.sin(t*4));waterTex.offset.y=-t*.3;
 for(const o of obs){if(Math.abs(o.y-b.y)>900)continue;
  if(o.rg){o.g.position.x=o.x+Math.sin(t*o.sp+o.ph)*o.amp;o.rg.rotation.x=t*3*(o.ph>3?1:-1)}
  else if(o.ar)o.ar.rotation.y=-(t*o.sp+o.ph);
  else if(o.k=='buoy'){o.g.position.y=Math.sin(t*2+o.x)*1.5;o.g.rotation.y=t*.4}}
 const asp=W/H,k=asp<1?1+(1-asp)*.95:1,sx=shake?(Math.random()-.5)*shake*20:0,sy=shake?(Math.random()-.5)*shake*12:0;
 const tp=new THREE.Vector3(b.x*.8+cx(b.y)*.2,88*k,b.y+138*k),tl=new THREE.Vector3(b.x*.6+cx(b.y-200)*.4,6,b.y-135);
 if(snap){camP.copy(tp);camL.copy(tl);snap=false}else{const a=Math.min(1,dt*4);camP.lerp(tp,a);camL.lerp(tl,a)}
 cam3.position.set(camP.x+sx,camP.y+sy,camP.z);cam3.lookAt(camL);clouds.position.set(camP.x*.7,0,camP.z);
}
function hud(){$('tm').textContent=fmt(tm);$('dd').textContent='💀 '+deaths;$('pgi').style.width=Math.max(0,Math.min(100,(S-b.y)/(S-110)*100))+'%';
 if(me>=0){const g=ps[me].gas;fb.style.setProperty('--g',g);fb.classList.toggle('low',g<20)}}
reset();menu();let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;mode=='guest'?gstep(dt):step(dt);upd(dt);R3.render(scene,cam3);hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
