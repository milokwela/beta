<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Пыкающие бегемоты</title>
<style>
:root{box-sizing:border-box;--card:#fff;--txt:#1b2733}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1e2a36;--txt:#f1f5f9}}
:root[data-theme="dark"]{--card:#1e2a36;--txt:#f1f5f9}
html,body{margin:0;height:100%;background:#6cc04a;overflow:hidden;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;text-shadow:0 1px 3px #0008;pointer-events:none}
#pg{flex:1;height:10px;background:#0004;border-radius:6px;overflow:hidden}#pgi{display:block;height:100%;width:0;background:#ffe14d}
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.g{flex:1;min-width:0}.gas{height:8px;background:#0005;border-radius:5px;overflow:hidden;margin-bottom:6px}.gas i{display:block;height:100%;width:100%}
.r{display:flex;gap:6px}
.r button{flex:1;height:80px;border:0;border-radius:18px;font-size:22px;font-weight:900;color:#fff;touch-action:none;box-shadow:0 4px 0 #0005;opacity:.92}
.r button.f{flex:2.2;font-size:20px}.r button.on{transform:translateY(3px);box-shadow:0 1px 0 #0005;filter:brightness(1.25)}
#g0 button{background:#e9822b}#g0 .gas i{background:#ffb066}#g1 button{background:#4d6a86}#g1 .gas i{background:#9cc3e8}#g2 button{background:#3a9d4f}#g2 .gas i{background:#b6f08a}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;padding:16px;overflow:auto}
.card{background:var(--card);color:var(--txt);border-radius:22px;padding:20px;max-width:420px;width:100%;text-align:center;line-height:1.4}
.card h1{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;font-size:15px}.card small{opacity:.7}
.mb{display:block;width:100%;margin-top:10px;border:0;background:#2dbf5a;color:#fff;font-size:18px;font-weight:800;padding:13px;border-radius:14px}
.row{display:flex;gap:8px;margin-top:10px}.row .mb{margin:0;flex:1}
#code{width:100px;font-size:22px;padding:10px;border-radius:12px;border:2px solid #8886;text-align:center;background:transparent;color:var(--txt)}
#toast{position:fixed;top:20%;left:0;right:0;text-align:center;color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 6px #000a;pointer-events:none;opacity:0;transition:opacity .3s}
#rot{display:none;position:fixed;inset:0;z-index:5;background:#000c;color:#fff;font-size:24px;font-weight:800;align-items:center;justify-content:center;text-align:center;padding:20px}
@media (orientation:portrait){body.local #rot{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="tm">0:00.0</span><div id="pg"><i id="pgi"></i></div><span id="dd">💀 0</span></div>
<div id="ctl">
<div class="g" id="g0"><div class="gas"><i></i></div><div class="r"><button data-p="0" data-a="L">◀</button><button class="f" data-p="0" data-a="F">ПЫК!</button><button data-p="0" data-a="R">▶</button></div></div>
<div class="g" id="g1"><div class="gas"><i></i></div><div class="r"><button data-p="1" data-a="L">◀</button><button class="f" data-p="1" data-a="F">ПЫК!</button><button data-p="1" data-a="R">▶</button></div></div>
<div class="g" id="g2"><div class="gas"><i></i></div><div class="r"><button data-p="2" data-a="L">◀</button><button class="f" data-p="2" data-a="F">ПЫК!</button><button data-p="2" data-a="R">▶</button></div></div>
</div>
<div id="toast"></div><div id="rot">🔄 Переверни телефон горизонтально — втроём так удобнее</div>
<div id="ov"><div class="card" id="cd"></div></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,DPR;function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',rs);rs();
const L=7600,S=L-200,CP=1300,P=210,R=25,MAXV=380;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const cx=y=>Math.sin(y/760)*210+Math.sin(y/310)*70,hw=y=>235+45*Math.sin(y/520+1);
const rr=rng(7),obs=[];
for(let y=L-900;y>500;y-=185){const c=cx(y),w=hw(y),t=Math.floor(rr()*5),p=1-y/L;
 if(t==0)obs.push({k:'rock',x:c-w*.45,y,r:26+rr()*10},{k:'rock',x:c+w*.4,y:y-40,r:26+rr()*10});
 else if(t==1){const g=c+(rr()-.5)*w*.8;obs.push({k:'buoy',x:g-85,y,r:22},{k:'buoy',x:g+85,y,r:22})}
 else if(t==2)obs.push({k:'roll',x:c,y,amp:w-100,sp:.7+rr()*.6+p*.5,ph:rr()*6});
 else if(t==3)obs.push({k:'spin',x:c+(rr()-.5)*w*.6,y,sp:(rr()<.5?-1:1)*(1+rr()),ph:rr()*6});
 else obs.push({k:'rock',x:c-w*.5,y,r:30},{k:'buoy',x:c+w*.35,y:y-30,r:22});}
function circs(o,t){if(o.k=='rock'||o.k=='buoy')return[[o.x,o.y,o.r,o.k=='buoy']];
 if(o.k=='roll'){const x=o.x+Math.sin(t*o.sp+o.ph)*o.amp,a=[];for(let k=-2;k<=2;k++)a.push([x+k*28,o.y,14,true]);return a}
 const an=t*o.sp+o.ph,a=[];for(let k=-3;k<=3;k++)a.push([o.x+Math.cos(an)*k*25,o.y+Math.sin(an)*k*25,k?10:14,false]);return a}
const b={x:0,y:S,vx:0,vy:0,a:0,w:0},cam={x:0,y:S},parts=[];
const mk=(i,ox,oy)=>({i,ox,oy,aim:0,gas:100,cd:0,L:0,R:0,F:0});
const ps=[mk(0,-14,8),mk(1,14,8),mk(2,0,-13)];
let t=0,tm=0,deaths=0,cpi=0,state='menu',shake=0,toastT=0,mode='local',me=-1,peer,conn,sn=null,sr=0;
function reset(){Object.assign(b,{x:cx(S),y:S,vx:0,vy:0,a:0,w:0});cam.x=b.x;cam.y=b.y;tm=0;deaths=0;cpi=0;ps.forEach(p=>{p.aim=0;p.gas=100;p.cd=0});parts.length=0}
reset();
const send=m=>{try{conn&&conn.open&&conn.send(m)}catch(e){}};
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;toastT=1.2}
let ac;function aud(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function snd(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),n=ac.currentTime,f=70+Math.random()*50;
 o.type='sawtooth';o.frequency.setValueAtTime(f*1.6,n);o.frequency.exponentialRampToValueAtTime(f*.6,n+.28);l.frequency.value=28+Math.random()*20;lg.gain.value=25;l.connect(lg);lg.connect(o.frequency);
 g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.connect(g);g.connect(ac.destination);o.start(n);l.start(n);o.stop(n+.3);l.stop(n+.3)}catch(e){}}
const dirOf=p=>{const f=b.a+p.aim;return[Math.sin(f),-Math.cos(f)]};
function fx(p){const[dx,dy]=dirOf(p),c=Math.cos(b.a),s=Math.sin(b.a),px=b.x+p.ox*c-p.oy*s,py=b.y+p.ox*s+p.oy*c;
 for(let i=0;i<8;i++)parts.push({x:px-dx*12,y:py-dy*12,vx:-dx*(70+Math.random()*90)+(Math.random()-.5)*70+b.vx*.3,vy:-dy*(70+Math.random()*90)+(Math.random()-.5)*70+b.vy*.3,l:1,r:7+Math.random()*7,g:1});
 snd();if((mode=='local'||p.i==me)&&navigator.vibrate)navigator.vibrate(20)}
function fire(p){const[dx,dy]=dirOf(p),c=Math.cos(b.a),s=Math.sin(b.a),rx=p.ox*c-p.oy*s,ry=p.ox*s+p.oy*c;
 b.vx+=dx*P;b.vy+=dy*P;b.w+=(rx*dy-ry*dx)*P*.0005;fx(p);if(mode=='host')send({e:'f',p:p.i})}
function die(){deaths++;shake=.4;for(let i=0;i<14;i++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:1,r:5,g:0});
 const y=S-cpi*CP;Object.assign(b,{x:cx(y),y,vx:0,vy:0,a:0,w:0});ps.forEach(p=>p.aim=0);if(mode=='host')send({e:'die'})}
function fxStep(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;const k=Math.exp(-2.5*dt);q.vx*=k;q.vy*=k;q.l-=dt*1.4;q.r+=dt*14;if(q.l<=0)parts.splice(i,1)}
 if(Math.hypot(b.vx,b.vy)>80&&Math.random()<.5)parts.push({x:b.x+(Math.random()-.5)*30,y:b.y+(Math.random()-.5)*30,vx:0,vy:0,l:.5,r:3,g:2});
 shake=Math.max(0,shake-dt);if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
 cam.x+=(b.x-cam.x)*Math.min(1,dt*5);cam.y+=(b.y-cam.y)*Math.min(1,dt*5)}
function step(dt){t+=dt;if(state=='play')tm+=dt;
 if(mode!='local'){const bt=ps[2],tx=cx(b.y-220)-b.x,want=Math.atan2(tx,220)-b.a+Math.sin(t*1.3)*.5;bt.L=want<bt.aim-.06?1:0;bt.R=want>bt.aim+.06?1:0;bt.F=Math.random()<dt*.9?1:0}
 for(const p of ps){p.aim+=((p.R?1:0)-(p.L?1:0))*1.9*dt;p.aim=Math.max(-1.2,Math.min(1.2,p.aim));p.cd-=dt;p.gas=Math.min(100,p.gas+15*dt);
  if(state=='play'&&p.F&&p.cd<=0&&p.gas>=20){fire(p);p.cd=.3;p.gas-=20}}
 const d=Math.exp(-dt);b.vx*=d;b.vy*=d;b.w*=Math.exp(-2.2*dt);const sp=Math.hypot(b.vx,b.vy);if(sp>MAXV){b.vx*=MAXV/sp;b.vy*=MAXV/sp}
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
 const c=cx(b.y),lim=hw(b.y)-8-R,dx=b.x-c;if(Math.abs(dx)>lim){const sg=Math.sign(dx);b.x=c+sg*lim;if(b.vx*sg>0)b.vx=-b.vx*.5;b.vy*=.92}
 if(state=='play')for(const o of obs){if(Math.abs(o.y-b.y)>260)continue;
  for(const[ox,oy,r,dead]of circs(o,t)){const ex=b.x-ox,ey=b.y-oy,dd=Math.hypot(ex,ey);if(dd<R+r){if(dead){die();return}
   const nx=ex/(dd||1),ny=ey/(dd||1),m=R+r;b.x=ox+nx*m;b.y=oy+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.7*vn*nx;b.vy-=1.7*vn*ny;b.w+=(Math.random()-.5)*3}}}}
 const ci=Math.floor((S-b.y)/CP);if(ci>cpi){cpi=ci;toast('Чекпоинт ✓');if(mode=='host')send({e:'cp'})}
 if(state=='play'&&b.y<110){state='win';showWin()}
 fxStep(dt)}
function gstep(dt){t+=dt;
 if(sn){const age=Math.min(.15,(performance.now()-sr)/1000),px=sn.x+sn.vx*age,py=sn.y+sn.vy*age;
  if(Math.hypot(px-b.x,py-b.y)>150){b.x=px;b.y=py}else{const k=Math.min(1,dt*12);b.x+=(px-b.x)*k;b.y+=(py-b.y)*k}
  b.a+=(sn.a+sn.w*age-b.a)*Math.min(1,dt*12);b.vx=sn.vx;b.vy=sn.vy;b.w=sn.w;t+=(sn.t+age-t)*.2;tm=sn.tm;deaths=sn.d;cpi=sn.cp;
  ps.forEach((p,i)=>{p.aim=sn.aim[i];p.gas=sn.gas[i]});
  if(state=='wait'&&sn.st=='play'){state='play';hide();setGroups()}
  if(sn.st=='win'&&state!='win'){state='win';showWin()}}
 fxStep(dt)}
const fmt=s=>Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');
const hide=()=>$('ov').style.display='none',show=h=>{$('ov').style.display='flex';$('cd').innerHTML=h};
function setGroups(){document.body.className=mode=='local'?'local':'';for(let i=0;i<3;i++)$('g'+i).style.display=(mode=='local'||i==me)?'':'none'}
function showWin(){show('<h1>🏁 Финиш!</h1><p>Время: <b>'+fmt(tm)+'</b></p><p>Падений на шипы: <b>'+deaths+'</b></p>'+(mode=='guest'?'<p>Ждём хоста…</p>':'<button class="mb" onclick="again()">Ещё раз</button>'))}
function again(){reset();state='play';hide();if(mode=='host')send({e:'restart'})}
function menu(){state='menu';mode='local';me=-1;show('<h1>🦛 Пыкающие бегемоты</h1><p>Три бегемота — одна лодка. Скалы отбивают, шипы откатывают на чекпоинт.</p><button class="mb" id="b3">👥 Втроём на одном телефоне</button><button class="mb" id="bh">🌐 Онлайн: создать комнату</button><div class="row"><input id="code" placeholder="код" inputmode="numeric" maxlength="4"><button class="mb" id="bj">Войти</button></div><p><small>Онлайн вас двое, третий бегемот — бот со своей головой.<br>ПК: A/D+W, ←/→+↑, J/L+I</small></p>');
 $('b3').onclick=()=>{aud();mode='local';me=-1;reset();state='play';setGroups();hide()};
 $('bh').onclick=hostRoom;$('bj').onclick=joinRoom}
function msg(s){show('<h1>'+s+'</h1><button class="mb" onclick="location.reload()">В меню</button>')}
function lost(){state='lost';msg('Связь потеряна 😢')}
function hostRoom(){aud();if(typeof Peer=='undefined')return msg('Онлайн недоступен (нет интернета?)');
 const code=String(1000+Math.floor(Math.random()*9000));peer=new Peer('hpfart'+code);
 peer.on('open',()=>show('<h1>Код комнаты</h1><h1 style="font-size:48px;letter-spacing:6px">'+code+'</h1><p>Пусть друг откроет эту же страницу и нажмёт «Войти» с этим кодом.</p><p>Ждём…</p><button class="mb" onclick="location.reload()">Отмена</button>'));
 peer.on('error',e=>{if(e.type=='unavailable-id')hostRoom();else msg('Ошибка: '+e.type)});
 peer.on('connection',c=>{if(conn)return;conn=c;
  c.on('open',()=>{mode='host';me=0;reset();state='play';setGroups();hide();setInterval(()=>send({s:{x:b.x,y:b.y,vx:b.vx,vy:b.vy,a:b.a,w:b.w,t,tm,d:deaths,cp:cpi,st:state,aim:ps.map(p=>p.aim),gas:ps.map(p=>p.gas)}}),50)});
  c.on('data',m=>{if(m.i){const p=ps[1];p.L=m.i[0];p.R=m.i[1];p.F=m.i[2]}});c.on('close',lost)})}
function joinRoom(){aud();const code=$('code').value.trim();if(code.length<4)return toast('Введи 4 цифры');if(typeof Peer=='undefined')return msg('Онлайн недоступен (нет интернета?)');
 show('<h1>Подключаемся…</h1>');peer=new Peer();
 peer.on('error',e=>msg(e.type=='peer-unavailable'?'Комната не найдена':'Ошибка: '+e.type));
 peer.on('open',()=>{conn=peer.connect('hpfart'+code,{reliable:true,serialization:'json'});
  conn.on('open',()=>{mode='guest';me=1;state='wait';show('<h1>Подключено ✓</h1><p>Ждём хоста…</p>');setGroups();setInterval(sendIn,100)});
  conn.on('close',lost);
  conn.on('data',m=>{if(m.s){sn=m.s;sr=performance.now()}else if(m.e=='f')fx(ps[m.p]);else if(m.e=='die'){shake=.4;for(let i=0;i<14;i++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:1,r:5,g:0})}
   else if(m.e=='cp')toast('Чекпоинт ✓');else if(m.e=='restart'){reset();sn=null;state='play';hide()}})})}
const sendIn=()=>{if(mode=='guest')send({i:[ps[1].L,ps[1].R,ps[1].F]})};
function hippo(x,y,col,sn){ctx.save();ctx.translate(x,y);ctx.scale(.85,.85);x=y=0;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y+3,10,0,7);ctx.fill();ctx.beginPath();ctx.arc(x-7,y-7,3,0,7);ctx.arc(x+7,y-7,3,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(x,y-6,8,0,7);ctx.fill();ctx.fillStyle=sn;ctx.beginPath();ctx.ellipse(x,y-11,6,4,0,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-3.5,y-6,2.6,0,7);ctx.arc(x+3.5,y-6,2.6,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-3.5,y-6.5,1.2,0,7);ctx.arc(x+3.5,y-6.5,1.2,0,7);ctx.fill();ctx.restore()}
function spikes(x,y,r,n,rot){ctx.fillStyle='#fff';for(let i=0;i<n;i++){const a=rot+i*6.283/n;ctx.beginPath();ctx.moveTo(x+Math.cos(a-.22)*r,y+Math.sin(a-.22)*r);ctx.lineTo(x+Math.cos(a)*(r+9),y+Math.sin(a)*(r+9));ctx.lineTo(x+Math.cos(a+.22)*r,y+Math.sin(a+.22)*r);ctx.fill()}}
const AC=['#ffb066','#cfe6ff','#b6f08a'];
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#6cc04a';ctx.fillRect(0,0,cv.width,cv.height);
 const sc=Math.min(W/600,H/560),s=sc*DPR,sx=shake?(Math.random()-.5)*shake*30:0,sy=shake?(Math.random()-.5)*shake*30:0;
 ctx.setTransform(s,0,0,s,DPR*(W/2+sx)-cam.x*s,DPR*(H/2+sy)-cam.y*s);
 const top=cam.y-H/2/sc-80,bot=cam.y+H/2/sc+80,y0=Math.floor(top/30)*30,y1=Math.ceil(bot/30)*30;
 for(let y=Math.floor(top/140)*140;y<bot;y+=140)for(const sd of[-1,1]){const x=cx(y)+sd*(hw(y)+80+hash(y*.13+sd)*220),yy=y+hash(y+sd)*60;
  ctx.fillStyle='#2f8f3a';ctx.beginPath();ctx.arc(x,yy,28,0,7);ctx.fill();ctx.fillStyle='#4fb04a';ctx.beginPath();ctx.arc(x-5,yy-6,20,0,7);ctx.fill()}
 for(const[off,col]of[[16,'#f0a04b'],[0,'#2aa6ee']]){ctx.fillStyle=col;ctx.beginPath();for(let y=y0;y<=y1;y+=30)ctx.lineTo(cx(y)-hw(y)-off,y);for(let y=y1;y>=y0;y-=30)ctx.lineTo(cx(y)+hw(y)+off,y);ctx.fill()}
 ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.lineCap='round';
 for(let y=Math.floor(top/90)*90;y<bot;y+=90)for(let j=0;j<4;j++){const h=hash(y*.7+j),x=cx(y)+(h-.5)*1.7*hw(y),yy=y+((t*25+j*20)%90);ctx.beginPath();ctx.moveTo(x-10,yy);ctx.lineTo(x+10,yy);ctx.stroke()}
 ctx.setLineDash([14,10]);ctx.strokeStyle='#fff9';ctx.lineWidth=3;for(let i=1;i<=5;i++){const y=S-i*CP;if(y<top||y>bot)continue;ctx.beginPath();ctx.moveTo(cx(y)-hw(y),y);ctx.lineTo(cx(y)+hw(y),y);ctx.stroke()}ctx.setLineDash([]);
 {const y=S-110,c=cx(y),w=hw(y)*.9;ctx.strokeStyle='#e8b23a';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(c-w,y+20);ctx.lineTo(c-w,y-30);ctx.lineTo(c+w,y-30);ctx.lineTo(c+w,y+20);ctx.stroke();
  ctx.fillStyle='#2a79c4';ctx.fillRect(c-45,y-48,90,30);ctx.fillStyle='#ffd23f';ctx.font='900 20px system-ui';ctx.textAlign='center';ctx.fillText('СТАРТ',c,y-26);
  const fy=100,fc=cx(fy),fw=hw(fy);for(let i=0;i<16;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#111':'#fff';ctx.fillRect(fc-fw+i*fw/8,fy+j*14-14,fw/8,14)}
