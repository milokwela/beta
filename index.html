 lp.on('error',e=>{if(e.type=='peer-unavailable')return;if(tok==mm)menu('Нет связи с сервером ('+e.type+')')});
 lp.on('open',()=>{err('');scan(tok);rt=setInterval(()=>scan(tok),4000)})}
function scan(tok){if(tok!=mm||!lp)return;for(let k=1;k<=NS;k++){const r=RM[k];if(r&&r.c.open){r.c.send({k:'q'});continue}if(r&&Date.now()-r.t<4500)continue;if(r)try{r.c.close()}catch(e){}
  const c=lp.connect('fartboat-r'+k,CS);RM[k]={c,t:Date.now(),n:null,b:1,ts:0};
  c.on('open',()=>c.send({k:'q'}));
  c.on('data',d=>{if(d.k=='info'&&RM[k]&&RM[k].c===c){RM[k].n=d.n;RM[k].b=d.b;RM[k].ts=Date.now();rooms()}});
  c.on('close',()=>{if(RM[k]&&RM[k].c===c){delete RM[k];rooms()}})}rooms()}
function rooms(){const el=$('rooms'),now=Date.now(),ks=Object.keys(RM).filter(k=>RM[k].n&&!RM[k].b&&now-RM[k].ts<9000);el.textContent='';
 if(!ks.length){const d=document.createElement('div');d.className='no';d.textContent='Пока нет команд. Создай свою — друг увидит её здесь!';el.appendChild(d)}
 ks.forEach(k=>{const d=document.createElement('div'),sp=document.createElement('span'),b=document.createElement('button');d.className='rm';sp.textContent='🦛 '+RM[k].n;b.textContent='Присоединиться';b.onclick=()=>joinR(+k);d.append(sp,b);el.appendChild(d)})}
function joinR(k){const r=RM[k];if(!r||!r.c.open)return err('Команда недоступна, обновляем список…');err('Подключаемся…');const c=r.c,tok=mm;let done=0;
 const to=setTimeout(()=>{if(!done)err('Не удалось соединиться. Попробуй Wi‑Fi или создай команду сам.')},9000);
 c.on('data',d=>{if(done)return;if(d.k=='hi'){done=1;clearTimeout(to);if(tok==mm)pair(c,0,nm(d.n))}else if(d.k=='busy'){done=1;clearTimeout(to);err('Команда уже занята')}});
 c.send({k:'hi',n:myName})}
function sendIn(){if(role=='guest'&&conn&&conn.open)conn.send({k:'i',m:inp[1].m,f:inp[1].f,n:inp[1].n})}
$('onl').onclick=()=>{audio();lobby()};$('mk').onclick=()=>{audio();mk()};
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>menu(''));
$('solo').onclick=()=>{audio();nick();names[0]=myName;names[1]='Друг';setRole('solo',0);play(true);reset()};
$('again').onclick=reset;
$('gear').onclick=()=>{mute=!mute;$('gear').textContent=mute?'🔇':'🔊'};
/* ---------- управление ---------- */
let mL=0,mR=0;const setM=()=>{inp[me].m=mR-mL;sendIn()};
[['bl',0],['br',1]].forEach(([id,r])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');if(r)mR=1;else mL=1;setM();audio()});['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>{b.classList.remove('on');if(r)mR=0;else mL=0;setM()}))});
const fb=$('fb');fb.addEventListener('pointerdown',e=>{e.preventDefault();fb.setPointerCapture(e.pointerId);inp[me].n++;inp[me].f=1;sendIn();audio()});
['pointerup','pointercancel'].forEach(t=>fb.addEventListener(t,()=>{inp[me].f=0;sendIn()}));
const K={};function kg(){inp[me].m=((K.ArrowRight||K.KeyD)?1:0)-((K.ArrowLeft||K.KeyA)?1:0);sendIn()}
addEventListener('keydown',e=>{if(e.repeat||e.target.tagName=='INPUT')return;K[e.code]=1;if(e.code=='Space'){inp[me].n++;inp[me].f=1;sendIn()}kg()});
addEventListener('keyup',e=>{K[e.code]=0;if(e.code=='Space'){inp[me].f=0;sendIn()}kg()});
/* ---------- цикл ---------- */
function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?72:58;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const pr=$('prog');CPS.slice(1).forEach(c=>{const u=document.createElement('u');u.style.left=c/L*100+'%';pr.appendChild(u)});
let last=performance.now(),st=0;cam.position.set(S.x,7,S.z+11);
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(role=='guest')guestSync(dt);else if(role=='solo'||(role=='host'&&conn&&conn.open))step(dt);else S.T+=dt;
 st+=dt;if(st>.05){st=0;if(role=='host'&&conn&&conn.open)conn.send({k:'s',ph:S.ph,T:S.T,cnt:S.cnt,rt:S.rt,b:[S.x,S.z,S.a,S.vx,S.vz,S.w],g:S.g,bu:S.bu,cd:S.cd,hp:S.hp,dd:S.dead,cp:S.cp,cn:S.coins,co:S.cl,iv:S.inv});else sendIn()}
 view(dt);ren.render(sc,cam)}
setNames();try{$('nick').value=localStorage.fbn||''}catch(e){}
requestAnimationFrame(loop);
</script></body></html>
