<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новогодняя рулетка</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded" rel="stylesheet">
<style>
:root{--bg:#0f1a17;--surf:#17241f;--surf2:#1f2f29;--pri:#ef5350;--on-pri:#fff;--sec:#66bb6a;--gold:#ffd54f;--txt:#e8f1ec;--muted:#9fb5aa;--r:28px}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,sans-serif;background:radial-gradient(circle at 50% 0,#1e3a30,var(--bg) 60%);color:var(--txt);min-height:100vh;overflow-x:hidden}
.ms{font-family:'Material Symbols Rounded';font-size:22px;vertical-align:middle;line-height:1}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.garland{display:flex;justify-content:space-around;padding:4px 0;position:relative;z-index:1}
.garland i{width:12px;height:12px;border-radius:50%;animation:blink 1.6s infinite}
.garland i:nth-child(4n){background:#ef5350}.garland i:nth-child(4n+1){background:#ffd54f;animation-delay:.4s}
.garland i:nth-child(4n+2){background:#66bb6a;animation-delay:.8s}.garland i:nth-child(4n+3){background:#42a5f5;animation-delay:1.2s}
@keyframes blink{50%{opacity:.25;transform:scale(.8)}}
header{text-align:center;padding:8px 16px;position:relative;z-index:1}
h1{margin:6px 0;font-weight:700;font-size:clamp(24px,6vw,36px)}
h1 span{color:var(--gold)}.sf{width:.9em;height:.9em;vertical-align:-.1em;color:#90caf9}
.orn{width:48px;height:56px}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:16px;grid-template-columns:1fr 320px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--surf);border-radius:var(--r);padding:16px;box-shadow:0 4px 20px #0006}
.seg{display:flex;background:var(--surf2);border-radius:100px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:100px;font:500 14px Roboto;cursor:pointer}
.seg button.on{background:var(--sec);color:#0b2410}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.wheelbox{position:relative;width:min(440px,88vw);aspect-ratio:1}
canvas#wheel{width:100%;height:100%;filter:drop-shadow(0 0 18px #ffd54f55)}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid var(--gold);filter:drop-shadow(0 3px 3px #000a);z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:70px;height:70px;border-radius:50%;background:var(--surf);border:4px solid var(--gold);display:grid;place-items:center;font-size:30px}
.stripbox{position:relative;width:100%;height:150px;overflow:hidden;border-radius:20px;background:var(--surf2);display:none}
.stripbox::before,.stripbox::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.stripbox::before{left:0;background:linear-gradient(90deg,var(--surf2),transparent)}
.stripbox::after{right:0;background:linear-gradient(-90deg,var(--surf2),transparent)}
.strip{display:flex;position:absolute;top:15px;left:0;will-change:transform}
.it{width:120px;height:120px;margin:0 5px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex:none;text-shadow:0 1px 3px #0008}
.it{gap:6px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:inset 0 0 0 2px #ffffff26,0 6px 14px #0006}
.card{background:linear-gradient(180deg,#1c2c26,#15211c);border:1px solid #ffffff12;backdrop-filter:blur(8px)}
.btn#spin{padding:18px 56px;font-size:20px;border-radius:24px;background:linear-gradient(135deg,#ef5350,#c62828);box-shadow:0 8px 24px #c6282866,inset 0 1px 0 #ffffff40;letter-spacing:.5px}
.btn#spin:active{transform:scale(.97)}
.sub{color:var(--muted);font-size:14px;margin:0 0 6px}
.p{transition:.2s}.p:hover{background:#2a3d35}
.dlg .card{border:2px solid #ffd54f55;box-shadow:0 0 60px #ffd54f33}
.line{position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--gold);transform:translateX(-50%);z-index:3;box-shadow:0 0 12px var(--gold)}
.btn{border:0;border-radius:100px;padding:14px 40px;font:500 18px Roboto;background:var(--pri);color:var(--on-pri);cursor:pointer;box-shadow:0 3px 10px #0007;transition:.2s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.tonal{background:var(--surf2);color:var(--txt);padding:10px 18px;font-size:14px;box-shadow:none}
h3{margin:4px 0 10px;font-weight:500;font-size:16px;color:var(--muted)}
.wheels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid #ffffff33;background:none;color:var(--txt);border-radius:10px;padding:7px 12px;cursor:pointer;font:500 13px Roboto}
.chip.on{background:#ffd54f33;border-color:var(--gold)}
.list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.p{display:flex;align-items:center;gap:10px;background:var(--surf2);padding:8px 10px;border-radius:14px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.p span{flex:1}
.ib{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%;padding:4px}
.ib:hover{background:#fff1;color:var(--pri)}
.add{display:flex;gap:6px;margin-top:10px}
input{flex:1;min-width:0;background:var(--surf2);border:1px solid #ffffff33;color:var(--txt);border-radius:12px;padding:10px 12px;font:14px Roboto;outline:none}
input:focus{border-color:var(--sec)}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hist{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted)}
.tg{width:44px;height:24px;border-radius:12px;background:var(--surf2);border:2px solid #ffffff44;position:relative;cursor:pointer}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.tg.on{background:var(--sec);border-color:var(--sec)}.tg.on::after{left:22px;background:#fff}
.dlg{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:10}
.dlg.show{display:grid}
.dlg .card{text-align:center;padding:32px 40px;animation:pop .4s}
.dlg .win{font-size:42px;font-weight:700;color:var(--gold);margin:10px 0 20px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="garland" id="garland"></div>
<header><h1><svg class="sf" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5M3 10l3.2-1.2L5.6 5.5M21 14l-3.2 1.2.6 3.3M3 14l3.2 1.2-.6 3.3M21 10l-3.2-1.2.6-3.3"/></g></svg> Новогодняя <span>рулетка</span> <svg class="sf" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9.5 3.5L12 6l2.5-2.5M9.5 20.5L12 18l2.5 2.5M3 10l3.2-1.2L5.6 5.5M21 14l-3.2 1.2.6 3.3M3 14l3.2 1.2-.6 3.3M21 10l-3.2-1.2.6-3.3"/></g></svg></h1><p class="sub">Крути колесо и узнай, кому повезёт в Новом году</p></header>
<main>
  <section class="card">
    <div class="seg"><button id="mWheel" class="on"><span class="ms">donut_large</span> Колесо фортуны</button><button id="mStrip"><span class="ms">view_carousel</span> Рулетка</button></div>
    <div class="stage">
      <div class="wheelbox" id="wheelbox"><div class="pointer"></div><canvas id="wheel" width="880" height="880"></canvas><div class="hub"><svg viewBox="0 0 24 24" width="40" height="40"><path fill="#ffd54f" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg></div></div>
      <div class="stripbox" id="stripbox"><div class="line"></div><div class="strip" id="strip"></div></div>
      <button class="btn" id="spin"><span class="ms">casino</span> Крутить!</button>
    </div>
  </section>
  <aside class="card">
    <h3>Рулетки</h3>
    <div class="wheels" id="wheels"></div>
    <div class="row" style="margin:0 0 14px"><button class="btn tonal" id="newWheel"><span class="ms">add</span> Новая</button><button class="btn tonal" id="renWheel"><span class="ms">edit</span></button><button class="btn tonal" id="delWheel"><span class="ms">delete</span></button></div>
    <h3>Участники</h3>
    <div class="list" id="list"></div>
    <div class="add"><input id="name" placeholder="Имя участника / название рулетки" maxlength="20"><button class="btn tonal" id="addBtn"><span class="ms">person_add</span></button></div>
    <div class="row"><button class="btn tonal" id="reset"><span class="ms">restart_alt</span> Сбросить к стандартным</button></div>
    <div class="sw"><span>Звуковая атмосфера</span><button class="ib" id="mic"><span class="ms">graphic_eq</span></button></div>
    <div class="hist" id="hist"></div>
  </aside>
</main>
<div class="dlg" id="dlg"><div class="card"><div style="color:var(--muted)">Выпал(а)</div><div class="win" id="winName"></div><button class="btn" id="ok">Ура!</button></div></div>
<script>
const DEF=['Игорь','Артём','Лена','Полина','Богдан'];
const COLORS=['#c62828','#2e7d32','#f9a825','#1565c0','#6a1b9a','#00838f','#d84315','#558b2f','#ad1457','#4527a0'];

let st;try{st=JSON.parse(localStorage.getItem('nyr'))}catch(e){}
if(!st||!st.wheels)st={wheels:[{name:'Главная',people:[...DEF]}],cur:0,rig:false,count:0,hist:[]};
const save=()=>{try{localStorage.setItem('nyr',JSON.stringify(st))}catch(e){}};
const W=()=>st.wheels[st.cur];
let mode='wheel',rot=0,spinning=false;
const $=id=>document.getElementById(id);
const cv=$('wheel'),cx=cv.getContext('2d');

function draw(){const p=W().people,n=p.length,R=440;cx.clearRect(0,0,880,880);
 if(!n){cx.fillStyle='#1f2f29';cx.beginPath();cx.arc(R,R,R-10,0,7);cx.fill();return}
 const a=2*Math.PI/n;
 for(let i=0;i<n;i++){const s=rot+i*a-Math.PI/2;cx.beginPath();cx.moveTo(R,R);cx.arc(R,R,R-14,s,s+a);cx.closePath();cx.fillStyle=COLORS[i%COLORS.length];cx.fill();cx.strokeStyle='#ffffffaa';cx.lineWidth=4;cx.stroke();
  cx.save();cx.translate(R,R);cx.rotate(s+a/2);cx.textAlign='right';cx.fillStyle='#fff';cx.font='bold '+Math.max(24,Math.min(44,300/n))+'px Roboto';cx.shadowColor='#0008';cx.shadowBlur=6;cx.fillText(p[i],R-50,14);cx.restore()}
 cx.beginPath();cx.arc(R,R,R-8,0,7);cx.strokeStyle='#ffd54f';cx.lineWidth=14;cx.stroke();
 for(let i=0;i<24;i++){const t=i/24*7;cx.beginPath();cx.arc(R+Math.cos(t)*(R-8),R+Math.sin(t)*(R-8),6,0,7);cx.fillStyle=i%2?'#fff':'#ef5350';cx.fill()}}

function render(keep){
 $('wheels').innerHTML=st.wheels.map((w,i)=>`<button class="chip ${i==st.cur?'on':''}" data-i="${i}">${esc(w.name)}</button>`).join('');
 $('list').innerHTML=W().people.map((n,i)=>`<div class="p"><div class="dot" style="background:${COLORS[i%COLORS.length]}"></div><span>${esc(n)}</span><button class="ib" data-d="${i}"><span class="ms">close</span></button></div>`).join('')||'<div class="hist">Добавьте участников</div>';
 $('hist').innerHTML=st.hist.length?'История: '+st.hist.slice(-8).map(esc).join(' → '):'';
 $('spin').disabled=spinning||W().people.length<2;
 draw();if(mode=='strip'&&!keep)buildStrip();save()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ===== Логика выбора =====
// st.rig: 'igor' — выпадает Игорь, 'not' — любой кроме Игоря, иначе честно
function pick(){const p=W().people,ig=p.indexOf('Игорь'),n=p.length;
 if(ig>=0&&n>1){if(st.rig==='igor'||st.rig===true)return ig;if(st.rig==='not'){let i;do{i=Math.floor(Math.random()*n)}while(i===ig);return i}}
 return Math.floor(Math.random()*n)}
const easeOut=k=>1-Math.pow(1-k,4),easeIO=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
let A=null,ctx=null;
function run(from,to,dur,ease,set,done){A={from,to,cur:from,t0:performance.now(),dur,ease,set,done};requestAnimationFrame(step)}
function step(){if(!A)return;const k=Math.min(1,(performance.now()-A.t0)/A.dur);A.cur=A.from+(A.to-A.from)*A.ease(k);A.set(A.cur);
 if(k<1)requestAnimationFrame(step);else{const d=A.done;A=null;d()}}
function retarget(to){const rem=Math.max(1400,A.dur-(performance.now()-A.t0));A.from=A.cur;A.to=to;A.t0=performance.now();A.dur=rem;A.ease=easeOut}
const TAU=2*Math.PI;
// --- Колесо ---
function wheelDelta(from,idx,f){const a=TAU/W().people.length;let base=(((-(idx+f)*a)%TAU)+TAU)%TAU,cur=((from%TAU)+TAU)%TAU,d=base-cur;if(d<0)d+=TAU;return d}
function spinWheel(){const p=W().people,n=p.length,win=pick(),ig=p.indexOf('Игорь');
 const fake=win===ig&&ig>=0&&(st.rig==='igor'||st.rig===true);ctx={t:'wheel',win,fake};
 const fi=fake?(win+1)%n:win,f=fake?.06+Math.random()*.08:.15+Math.random()*.7;
 run(rot,rot+wheelDelta(rot,fi,f)+TAU*6,5400,easeOut,v=>{rot=v;draw()},wheelMainDone)}
function wheelMainDone(){if(ctx.fake){ctx.fake=false;setTimeout(()=>{if(!ctx)return;ctx.creep=true;run(rot,rot+wheelDelta(rot,ctx.win,.55+Math.random()*.2),1100,easeIO,v=>{rot=v;draw()},()=>finish(W().people[ctx.win]))},650)}else finish(W().people[ctx.win])}
function wheelRetarget(win){ctx.win=win;ctx.fake=false;const f=.2+Math.random()*.6;
 if(A){const end=A.to;retarget(end+wheelDelta(end,win,f)-0)}else{/* в паузе перед доводкой */ctx.creep=true}}
// --- Лента ---
const IW=130;let stripItems=[];
const cen=i=>i*IW+IW/2;
function card(n){const i=W().people.indexOf(n);return `<div class="it" style="--c:${COLORS[i%COLORS.length]}"><svg class="orn" viewBox="0 0 48 56"><rect x="19" y="2" width="10" height="8" rx="2" fill="#ffd54f"/><circle cx="24" cy="32" r="21" fill="#ffffff22" stroke="#fff" stroke-width="2.5"/><path d="M5 28q19 8 38 0" stroke="#ffd54f" stroke-width="2.5" fill="none"/><text x="24" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Roboto">${esc(n[0]||'')}</text></svg>${esc(n)}</div>`}
const boxC=()=>$('stripbox').clientWidth/2;
let sd=0;const setS=d=>{sd=d;$('strip').style.transform=`translateX(${boxC()-d}px)`};
function buildStrip(list){const p=W().people;if(!p.length){$('strip').innerHTML='';return}
 stripItems=list||Array.from({length:12},(_,k)=>p[k%p.length]);$('strip').innerHTML=stripItems.map(card).join('');if(!list)setS(cen(2))}
function spinStrip(){const p=W().people,n=p.length,STOP=50,win=pick(),ig=p.indexOf('Игорь');
 const fake=win===ig&&ig>=0&&(st.rig==='igor'||st.rig===true);
 const list=Array.from({length:STOP+20},()=>p[Math.floor(Math.random()*n)]);
 if(fake){let o;do{o=p[Math.floor(Math.random()*n)]}while(o==='Игорь');list[STOP]=o;list[STOP+1]=p[win]}else list[STOP]=p[win];
 buildStrip(list);setS(cen(2));ctx={t:'strip',win,fake,idx:fake?STOP+1:STOP};
 const end=fake?STOP*IW+IW-12:STOP*IW+18+Math.random()*(IW-36);
 run(sd,end,5600,easeOut,setS,stripMainDone)}
function stripMainDone(){if(ctx.fake){ctx.fake=false;setTimeout(()=>{if(!ctx)return;ctx.creep=true;run(sd,cen(ctx.idx),1100,easeIO,setS,()=>finish(stripItems[ctx.idx]))},650)}else finish(stripItems[ctx.idx])}
function stripRetarget(win){const name=W().people[win],lim=sd+boxC()+80;ctx.fake=false;
 let base=A?A.to:sd,j=Math.round((base-IW/2)/IW),k=-1;
 for(let d=0;d<8&&k<0;d++)for(const c of[j+d,j-d])if(c>=0&&c<stripItems.length&&cen(c)>sd+10&&stripItems[c]===name){k=c;break}
 if(k<0){k=Math.max(j,Math.ceil((lim)/IW)+1);if(k>=stripItems.length){k=stripItems.length-1}stripItems[k]=name;$('strip').children[k].outerHTML=card(name)}
 ctx.idx=k;const to=cen(k)-IW/2+18+Math.random()*(IW-36);if(A)retarget(to);else ctx.creep=true}
// реакция на голос во время вращения
function onVoice(){if(!spinning||!ctx)return;const p=W().people,ig=p.indexOf('Игорь');if(ig<0)return;
 const curName=ctx.t==='wheel'?p[ctx.win]:stripItems[ctx.idx];
 if((st.rig==='igor'&&curName!=='Игорь')||(st.rig==='not'&&curName==='Игорь')){const w=pick();ctx.t==='wheel'?wheelRetarget(w):stripRetarget(w)}}
function finish(name){spinning=false;ctx=null;st.hist.push(name);$('winName').textContent=name;$('dlg').classList.add('show');confetti();render(true)}

$('spin').onclick=()=>{if(spinning||W().people.length<2)return;spinning=true;$('spin').disabled=true;save();mode=='wheel'?spinWheel():spinStrip()};
$('ok').onclick=()=>$('dlg').classList.remove('show');
$('mWheel').onclick=()=>{if(spinning)return;mode='wheel';$('mWheel').classList.add('on');$('mStrip').classList.remove('on');$('wheelbox').style.display='';$('stripbox').style.display='none'};
$('mStrip').onclick=()=>{if(spinning)return;mode='strip';$('mStrip').classList.add('on');$('mWheel').classList.remove('on');$('wheelbox').style.display='none';$('stripbox').style.display='block';buildStrip()};
$('wheels').onclick=e=>{const b=e.target.closest('[data-i]');if(b&&!spinning){st.cur=+b.dataset.i;rot=0;render()}};
$('list').onclick=e=>{const b=e.target.closest('[data-d]');if(b&&!spinning){W().people.splice(+b.dataset.d,1);render()}};
const add=()=>{const v=$('name').value.trim();if(v&&!spinning&&W().people.length<10){W().people.push(v);$('name').value='';render()}};
$('addBtn').onclick=add;$('name').onkeydown=e=>e.key=='Enter'&&add();
$('reset').onclick=()=>{if(!spinning){W().people=[...DEF];render()}};
$('newWheel').onclick=()=>{{const n=$('name').value.trim()||'Рулетка '+(st.wheels.length+1);$('name').value='';st.wheels.push({name:n.slice(0,20),people:[...DEF]});st.cur=st.wheels.length-1;render()}};
$('renWheel').onclick=()=>{const n=$('name').value.trim();if(n){$('name').value='';W().name=n.slice(0,20);render()}};
$('delWheel').onclick=()=>{if(st.wheels.length>1&&!spinning){st.wheels.splice(st.cur,1);st.cur=0;render()}};

// Голос: «рыба» → Игорь, «ананас» → случайно
let rec=null,micOn=false;
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||rec)return;
 rec=new SR();rec.lang='ru-RU';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.toLowerCase();
  if(t.includes('рыб')){if(st.rig!=='igor'){st.rig='igor';save();blip();onVoice()}}else if(t.includes('ананас')){if(st.rig!=='not'){st.rig='not';save();blip();onVoice()}}}};
 rec.onend=()=>{if(micOn)try{rec.start()}catch(e){}};
 rec.onerror=e=>{if(e.error=='not-allowed'){micOn=false;rec=null}};
 try{rec.start();micOn=true;$('mic').style.color='var(--sec)'}catch(e){}}
function blip(){const m=$('mic');m.style.opacity='.4';setTimeout(()=>m.style.opacity='',250)}
$('mic').onclick=startMic;

// Гирлянда и снег
$('garland').innerHTML='<i></i>'.repeat(28);
const sc=$('snow'),sx=sc.getContext('2d');let flakes=[];
function rs(){sc.width=innerWidth;sc.height=innerHeight}rs();onresize=()=>{rs();draw()};
for(let i=0;i<110;i++)flakes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:1+Math.random()*3,s:.4+Math.random()*1.2,w:Math.random()*6});
let conf=[];function confetti(){for(let i=0;i<150;i++)conf.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,c:COLORS[i%10],l:120})}
