function step(dt){S.T+=dt;S.inv=Math.max(0,S.inv-dt);if(S.ph==2)S.rt+=dt;
 if(S.ph==1&&(S.cnt-=dt)<=0){S.ph=2;S.rt=0}
 const ra=rAng(S.z);
 for(let i=0;i<2;i++){const p=inp[i],b=S.g[i],o=S.g[1-i];let nb=b+Math.max(-4*dt,Math.min(4*dt,wrap(ra+p.g-b)));

  if(S.bu[i]>0){S.bu[i]=Math.max(0,S.bu[i]-dt);S.vx-=Math.sin(S.g[i])*F*dt;S.vz-=Math.cos(S.g[i])*F*dt}}
 if(S.dead>0){S.bu=[0,0];S.dead-=dt;if(S.dead<=0){const cs=CPS[S.cp]+4;Object.assign(S,{x:cx(cs),z:-cs,a:0,vx:0,vz:0,w:0,hp:100,inv:2,dead:0})}else return}
 if(S.ph<2)return;

 s=-S.z;n=Math.hypot(dcx(s),1);const c=cx(s),lim=HW(s)-R,d=S.x-c;
 if(Math.abs(d)>lim){const sg=Math.sign(d),nx=1/n,nz=dcx(s)/n;S.x=c+sg*lim;const vn=(S.vx*nx+S.vz*nz)*sg;if(vn>0){S.vx-=1.5*vn*sg*nx;S.vz-=1.5*vn*sg*nz;S.w*=.8}}
 for(const o of OB){const[ox,oz,ux,uz]=oC(o,S.T);if(Math.abs(oz-S.z)>14)continue;
  const t=o.h?Math.max(-o.h,Math.min(o.h,(S.x-ox)*ux+(S.z-oz)*uz)):0,px=ox+ux*t,pz=oz+uz*t,dx=S.x-px,dz=S.z-pz,rr=R+o.r,dd=Math.hypot(dx,dz)||.001;
  if(dd<rr){const nx=dx/dd,nz=dz/dd;S.x=px+nx*rr;S.z=pz+nz*rr;const vn=S.vx*nx+S.vz*nz;if(vn<0){const e=o.t==1?1.3:2;S.vx-=e*vn*nx;S.vz-=e*vn*nz}S.vx+=nx*2.5;S.vz+=nz*2.5;S.w+=(Math.random()-.5)*5;
   if(S.inv<=0){S.hp-=o.t==1?8:25;S.inv=1}}}
 if(S.hp<=0&&!S.dead){S.hp=0;S.dead=2.2;S.vx=S.vz=0}
 CO.forEach((q,i)=>{if(!got[i]&&Math.abs(q.z-S.z)<4&&Math.hypot(q.x-S.x,q.z-S.z)<R+.9){got[i]=1;S.cl.push(i);S.coins++}});

 Object.assign(S,{g:NET.g,bu:NET.bu,cd:NET.cd,hp:NET.hp,cp:NET.cp,coins:NET.cn,cl:NET.co,inv:NET.iv,ph:NET.ph,T:NET.T+e,dead:Math.max(0,NET.dd-e),cnt:NET.cnt-(NET.ph==1?e:0),rt:NET.rt+(NET.ph==2?e:0)});

function view(dt){const ra=rAng(S.z),s=-S.z,n=Math.hypot(dcx(s),1),k=Math.min(1,dt*3),kp=Math.min(1,dt*5);

 cam.lookAt(S.x+cf.x*10,.5,S.z+cf.z*10);
 const dk=S.dead>0?1-S.dead/2.2:0;

 hip.forEach((h,i)=>{const dl=wrap(S.g[i]-vb[i]);vb[i]+=dl*Math.min(1,dt*14);const bl=vb[i]-S.a,b=S.bu[i]>0,mv=Math.abs(dl)>.04;
  h.position.set(Math.sin(bl)*1.15,.2+(mv?Math.abs(Math.sin(S.T*16))*.07:0),Math.cos(bl)*1.15);h.rotation.y=bl;
  const sq=dk>0?1-dk*.4:1;h.scale.set((b?1.12:1)*.85,(b?.9:1)*.85*sq,(b?1.12:1)*.85);
  if(b){pf[i]-=dt;if(pf[i]<=0){pf[i]=.045;const bx=Math.sin(S.g[i]),bz=Math.cos(S.g[i]);h.getWorldPosition(V2);V2.set(V2.x+bx*1.1,.9,V2.z+bz*1.1);puff(V2,V.set(bx*5+(Math.random()-.5)*2,1.2,bz*5+(Math.random()-.5)*2),0xb8f21c,.5,2.4,.9)}}
  if(b&&!pb[i]){fart();if(i==me&&navigator.vibrate)navigator.vibrate(40)}pb[i]=b});
 wk-=dt;const sp=Math.hypot(S.vx,S.vz);if(wk<=0&&sp>2&&S.ph>1&&!S.dead){wk=.1;puff(V2.set(S.x-S.vx/sp*2.2,.1,S.z-S.vz/sp*2.2),V.set(0,.4,0),0xffffff,.5,1.5,.7)}
 upPuff(dt);wu.uT.value=S.T;mark.position.y=3+Math.sin(S.T*4)*.15;
 for(const o of OB){const[x,z,ux,uz]=oC(o,S.T);if(o.t==2){o.m.position.set(x,.2,z);o.m.rotation.y=-Math.atan2(uz,ux);o.m.userData.sp.rotation.x=S.T*1.5}else{o.m.position.set(x,o.t==1?-.2:Math.sin(S.T*2+o.ph)*.12,z);if(o.t==0)o.m.userData.sp.rotation.y=S.T*.8+o.ph}}

 if(S.hp<pHp&&navigator.vibrate)navigator.vibrate(90);if(S.hp<pHp)tone(220,110,.25,'square');pHp=S.hp;

 if(S.cp>pCp){cpT=1.6;tone(520,780,.4,'triangle')}pCp=S.cp;cpT=Math.max(0,cpT-dt);
 if(S.ph==3&&!fin){fin=1;try{wallet+=S.coins;localStorage.fbw=wallet;if(!best||S.rt<best){best=S.rt;localStorage.fbb=best}}catch(e){}}if(S.ph<3)fin=0;
 $('wc').textContent=wallet;
 $('pf').style.width=Math.max(0,Math.min(1,-S.z/L))*100+'%';$('tm').textContent=fmt(S.rt);$('co').textContent='🪙 '+S.coins;$('hpf').style.width=S.hp+'%';
 $('cdm').style.background=`conic-gradient(#0008 ${S.cd[me]/.95*360}deg,#0000 0)`;
 let m='';if(!role)m='';else if(S.dead>0)m='💀 Разбились!<small>Возрождение на чекпоинте…</small>';else if(S.ph==1)m=Math.ceil(S.cnt);else if(cpT>0)m='Чекпоинт! ✔';else if(S.ph==2&&S.rt<1)m='ПЫК!';else if(S.ph==3)m=`🏁 Финиш!<small>${fmt(S.rt)} · монеты: ${S.coins}</small>`;

/* ---------- меню и сеть ---------- */
const hudIds=['prog','top','jz','fb'];
function play(on){$('menu').hidden=on;hudIds.forEach(i=>$(i).hidden=!on);if(!on)$('jb').style.display='none'}
const pane=n=>['mm','pj','ph'].forEach(k=>$(k).hidden=k!=n),err=t=>$('err').textContent=t||'';
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}
function setRole(r,i){role=r;me=i;hip[i].add(mark)}
const gen=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
function menu(t){role=null;S.ph=0;if(peer)try{peer.destroy()}catch(e){}peer=conn=null;S.g=[.53,-.53];play(false);pane('mm');err(t)}
function host(){setRole('host',0);code=gen();$('code').textContent='····';pane('ph');peer=new Peer('fartboat-'+code);
 peer.on('open',()=>$('code').textContent=code);
 peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();host()}else err('Ошибка сети: '+e.type)});
 peer.on('connection',c=>{if(conn&&conn.open){c.close();return}conn=c;
  c.on('open',()=>{play(true);reset()});
  c.on('data',d=>{if(d.k=='i'){inp[1].g=d.g;inp[1].f=d.f;inp[1].n=d.n}});
  c.on('close',()=>{conn=null;S.ph=0;play(false);pane('ph');err('Друг отключился. Ждём нового игрока…')})})}
function join(c){c=c.trim().toUpperCase();if(c.length!=4)return err('Введи код из 4 букв');err('Подключаемся…');setRole('guest',1);peer=new Peer();

  conn.on('open',()=>{play(true);err('');sendIn()});
  conn.on('data',d=>{if(d.k=='s'){NET=d;NET.at=performance.now()}});
  conn.on('close',()=>menu('Связь потеряна'))});
